# Nether Earth v1 production stack: one VPS, three containers.
#
#   browser -> gateway (Nginx, public port) -> frontend (static files)
#                                           \-> backend (FastAPI) -> host replay directory
#
# No database, Redis, broker, Kubernetes, or distributed match storage (v1 scope).
# Configuration comes from deploy/.env (copy deploy/.env.example); required values
# fail `docker compose config` / `up` instead of falling back to unsafe defaults.
# Operations guide: docs/operations/runbook.md

name: nether-earth

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  gateway:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "${NETHER_EARTH_HTTP_PORT:-80}:8080"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nether-earth-http.inc:/etc/nginx/snippets/nether-earth-http.inc:ro
      - ./nginx/nether-earth-locations.inc:/etc/nginx/snippets/nether-earth-locations.inc:ro
    tmpfs: [/tmp]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m

  frontend:
    <<: *hardening
    image: nether-earth-frontend:${NETHER_EARTH_VERSION:?set NETHER_EARTH_VERSION in deploy/.env}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    tmpfs: [/tmp]
    mem_limit: 64m

  backend:
    <<: *hardening
    image: nether-earth-backend:${NETHER_EARTH_VERSION:?set NETHER_EARTH_VERSION in deploy/.env}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NETHER_EARTH_ENV: production
      NETHER_EARTH_PUBLIC_BASE_URL: ${NETHER_EARTH_PUBLIC_BASE_URL:?set NETHER_EARTH_PUBLIC_BASE_URL in deploy/.env}
      NETHER_EARTH_REPLAY_DIR: /var/lib/nether-earth/replays
      NETHER_EARTH_LOG_LEVEL: ${NETHER_EARTH_LOG_LEVEL:-INFO}
      NETHER_EARTH_MAX_MATCHES: ${NETHER_EARTH_MAX_MATCHES:-200}
      NETHER_EARTH_FINISHED_MATCH_RETENTION_SECONDS: ${NETHER_EARTH_FINISHED_MATCH_RETENTION_SECONDS:-300}
      NETHER_EARTH_WAITING_MATCH_TIMEOUT_SECONDS: ${NETHER_EARTH_WAITING_MATCH_TIMEOUT_SECONDS:-900}
    volumes:
      # Host directory must be writable by uid 10001 (the image's runtime user).
      - ${NETHER_EARTH_REPLAY_HOST_DIR:?set NETHER_EARTH_REPLAY_HOST_DIR in deploy/.env}:/var/lib/nether-earth/replays
    tmpfs: [/tmp]
    stop_grace_period: 15s
    mem_limit: ${NETHER_EARTH_BACKEND_MEM_LIMIT:-1g}
    cpus: ${NETHER_EARTH_BACKEND_CPUS:-1.0}
