# TLS override: Nginx terminates HTTPS and redirects HTTP to it.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml --env-file deploy/.env up -d
services:
  gateway:
    ports:
      - "${NETHER_EARTH_HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/gateway-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NETHER_EARTH_TLS_CERT_DIR:?set NETHER_EARTH_TLS_CERT_DIR in deploy/.env}:/etc/nginx/certs:ro
      - ${NETHER_EARTH_ACME_WEBROOT:?set NETHER_EARTH_ACME_WEBROOT in deploy/.env}:/var/www/acme:ro
