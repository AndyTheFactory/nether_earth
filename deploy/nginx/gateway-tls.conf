# Gateway with TLS termination at Nginx (enabled by docker-compose.tls.yml).
# Certificates are read from /etc/nginx/certs (fullchain.pem, privkey.pem),
# which must be readable by uid 101. See docs/operations/runbook.md.
include /etc/nginx/snippets/nether-earth-http.inc;

server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME HTTP-01 challenges (certbot --webroot -w <NETHER_EARTH_ACME_WEBROOT>).
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ne_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/nether-earth-locations.inc;
}
