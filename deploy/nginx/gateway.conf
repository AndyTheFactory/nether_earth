# Gateway, plain HTTP. Use as-is for local/CI smoke or behind an external TLS
# terminator; docker-compose.tls.yml swaps in gateway-tls.conf for HTTPS.
include /etc/nginx/snippets/nether-earth-http.inc;

server {
    listen 8080;
    server_name _;
    include /etc/nginx/snippets/nether-earth-locations.inc;
}
