# M5 milestone integration fixture (issue #68, M5.9).
#
# One battlefield laid out in independent, non-overlapping "lanes" so a
# single coherent command stream can exercise every M5 rule in
# `_specs/milestones/05-orders-navigation-capture.md`'s "Milestone
# integration scenario" without any lane's robots/terrain/structures
# interfering with another's.
#
# CR002.3/CR002.4 (open-questions.md §21): robots and commanders are 2×2
# bodies anchored at their (x, y); a body covers x..x+1, y-1..y. The lanes
# are laid out for 2×2 bodies:
#
# - rows 0..5, x=0..7: chassis terrain-permission / movement-duration lane.
#   Column 3 is ROUGH and columns 4..5 are DITCH on every lane row, so a
#   bipod (anchor row 1), tracks (row 3) and anti-grav (row 5) robot each
#   walk the identical normal -> rough -> rough+ditch -> ditch sequence of
#   destination bodies: bipod/tracks may enter rough but never a body with
#   a ditch cell (locked terrain permissions); anti-grav may enter all.
#   Comparing each chassis's normal-terrain move duration proves the locked
#   "bipod < tracks < anti-grav" ordinary-terrain speed ranking.
# - rows 7..13, x=10..28: navigation lane. A 5-cell-tall blocker wall at
#   x=15 (rows 7-11) with a clear gap at rows 12-13 gives non-electronic vs
#   electronic robots advancing along anchor rows 8/11 the same wall dead
#   ahead: non-electronic has no detour logic and stalls nose-to-wall;
#   electronic pathfinds down to the gap and through.
# - rows 16..19, x=18..22: neutral factory `factory-neutral` with a
#   two-cell capture point (19, 17)/(20, 17). The contention robots stand
#   one step west/east of it; their first steps onto their nearest capture
#   cells overlap, so they contend.
# - rows 21..24, x=1..4: commander-blocking lane. p2's commander parks so
#   its body overlaps the lane robot's next body, then steps aside.
# - rows 25..26, x=5..8: adjacent hostile robots for Search & Destroy /
#   engagement intent (Stop & Defend vs Search & Destroy(robot)).
# - rows 27..28, x=2..4: direct-control lane, p1's commander docked to the
#   lane robot from tick 0.
# - rows 29..31: capture lane. `factory-enemy` (owned by p1) is captured
#   continuously by a p2 robot; `warbase-p1` (p1's only war base) is
#   captured, interrupted, and re-captured by a second p2 robot, whose
#   eventual completion is p1's last war base and triggers same-step
#   victory for p2.
id: fixture-m5-integration
version: 1
width: 40
height: 32

terrain:
  default: normal
  cells:
    - {x: 3, y: 0, type: rough}
    - {x: 3, y: 1, type: rough}
    - {x: 3, y: 2, type: rough}
    - {x: 3, y: 3, type: rough}
    - {x: 3, y: 4, type: rough}
    - {x: 3, y: 5, type: rough}
    - {x: 4, y: 0, type: ditch}
    - {x: 4, y: 1, type: ditch}
    - {x: 4, y: 2, type: ditch}
    - {x: 4, y: 3, type: ditch}
    - {x: 4, y: 4, type: ditch}
    - {x: 4, y: 5, type: ditch}
    - {x: 5, y: 0, type: ditch}
    - {x: 5, y: 1, type: ditch}
    - {x: 5, y: 2, type: ditch}
    - {x: 5, y: 3, type: ditch}
    - {x: 5, y: 4, type: ditch}
    - {x: 5, y: 5, type: ditch}

war_bases:
  - id: warbase-p1
    components:
      - {x: 1, y: 31, height: 3}
    owner: p1

  - id: warbase-p2
    components:
      - {x: 38, y: 31, height: 3}
    owner: p2

factories:
  - id: factory-neutral
    components:
      - {x: 19, y: 19, height: 2}
      - {x: 20, y: 19, height: 2}
    factory_type: chassis
    owner: null

  - id: factory-enemy
    components:
      - {x: 25, y: 31, height: 2}
    factory_type: cannon
    owner: p1

blockers:
  - id: nav-wall
    components:
      - {x: 15, y: 7, height: 1}
      - {x: 15, y: 8, height: 1}
      - {x: 15, y: 9, height: 1}
      - {x: 15, y: 10, height: 1}
      - {x: 15, y: 11, height: 1}

interaction_points:
  - id: factory-neutral-capture
    kind: factory_capture
    structure_id: factory-neutral
    footprint: [{x: 19, y: 17}, {x: 20, y: 17}]

  - id: factory-enemy-capture
    kind: factory_capture
    structure_id: factory-enemy
    footprint: {x: 25, y: 30}

  - id: warbase-p1-capture
    kind: warbase_capture
    structure_id: warbase-p1
    footprint: {x: 2, y: 31}

spawn_positions:
  p1_commander: {x: 2, y: 28}
  p2_commander: {x: 3, y: 23}
