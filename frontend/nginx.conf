# Static file server inside the frontend image (non-root, port 8080).
# The public-facing gateway (deploy/nginx/) sits in front of this.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Vite emits content-hashed file names under /assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
