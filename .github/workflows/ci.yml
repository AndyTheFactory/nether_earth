name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './engine[dev]' -e './backend[dev]'
      - name: Ruff
        run: ruff check engine backend
      - name: Engine typing
        run: cd engine && mypy src
      - name: Backend typing
        run: cd backend && mypy app
      - name: Tests
        run: pytest engine/tests backend/tests

  frontend-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Validate protocol schemas
        working-directory: frontend
        run: npm run protocol:validate
      - name: Generate protocol types
        working-directory: frontend
        run: npm run protocol:generate
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
