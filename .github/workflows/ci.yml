# v1 release gates. Linux runners only; three jobs, no duplicated test runs.
# Policy: every PR and every push to main runs all jobs; a failing job blocks merge/release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Engine + backend (lint, types, tests, deterministic replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            backend/pyproject.toml
            backend/requirements.lock
      - name: Install (runtime deps pinned to the production lock)
        run: |
          # Constraints files cannot carry --hash entries; strip them for -c.
          sed -e 's/ \\$//' -e '/^    --hash/d' backend/requirements.lock > /tmp/constraints.txt
          python -m pip install -c /tmp/constraints.txt -e './engine[dev]' -e './backend[dev]'
          python -m pip check
      - name: Ruff
        run: ruff check engine backend
      - name: Mypy
        run: |
          (cd engine && mypy src)
          (cd backend && mypy app)
      # Includes the M9 scripted full-match regression (identical replay
      # hashes across runs), replay verification and runtime integration.
      - name: Pytest
        run: pytest -q

  frontend-protocol:
    name: Protocol + frontend (schemas, generated drift, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Validate protocol schemas and fixtures
        run: npm run protocol:validate
        working-directory: frontend
      - name: Generated artifacts are current
        working-directory: frontend
        run: |
          npm run protocol:generate
          npm run map:generate
          npm run rules:generate
          git diff --exit-code -- ../protocol/generated src/generated
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Release version is consistent
        run: scripts/check-version.sh

  deployment:
    name: Images, Compose/Nginx config, deployment smoke
    needs: [python, frontend-protocol]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Compose and Nginx configuration
        run: make compose-check
      - name: Production images + deployment smoke (health, headers, origin, match, replay, restart)
        run: deploy/smoke.sh
