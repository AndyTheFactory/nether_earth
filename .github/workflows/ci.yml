# v1 release gates. Linux runners only; three jobs, no duplicated test runs.
# Policy: every PR and every push to main runs all jobs; a failing job blocks merge/release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Engine + backend (lint, types, tests, deterministic replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            backend/pyproject.toml
            backend/requirements.lock
      - name: Install (runtime deps pinned to the production lock)
        run: python -m pip install -c backend/requirements.lock -e './engine[dev]' -e './backend[dev]'
      - name: Ruff
        run: ruff check engine backend
      - name: Mypy
        run: |
          (cd engine && mypy src)
          (cd backend && mypy app)
      # Includes the M9 scripted full-match regression (identical replay
      # hashes across runs), replay verification and runtime integration.
      - name: Pytest
        run: pytest -q

  frontend-protocol:
    name: Protocol + frontend (schemas, generated drift, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Validate protocol schemas and fixtures
        run: npm run protocol:validate
        working-directory: frontend
      - name: Generated artifacts are current
        working-directory: frontend
        run: |
          npm run protocol:generate
          npm run map:generate
          npm run rules:generate
          git diff --exit-code -- ../protocol/generated src/generated
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Release version is consistent
        run: scripts/check-version.sh

  deployment:
    name: Images, Compose/Nginx config, deployment smoke
    needs: [python, frontend-protocol]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Compose and Nginx configuration
        run: make compose-check
      - name: Production images + deployment smoke (health, headers, origin, match, replay, restart)
        run: deploy/smoke.sh
